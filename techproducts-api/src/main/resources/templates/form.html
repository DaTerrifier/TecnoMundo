<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Producto</title>
</head>
<body>
    <h1 th:text="${producto != null ? 'Editar Producto' : 'Nuevo Producto'}"></h1>
    <form th:action="@{/guardar}" th:object="${producto}" method="post">
        <input type="hidden" th:field="*{idProd}" />
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" /><br/>
        <label>Precio:</label>
        <input type="text" th:field="*{precio}" /><br/>
        <label>Imagen (URL):</label>
        <input type="text" th:field="*{imagen}" /><br/>
        <button type="submit">Guardar</button>
    </form>
    <a href="/">Regresar</a>
</body>
</html>
